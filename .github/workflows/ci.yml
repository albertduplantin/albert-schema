name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Types et construction
        run: npm run build
      - name: Tests (moteur, tracé, exports, exercices, API)
        run: npm test
      - name: Tests de bout en bout (Chrome)
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
